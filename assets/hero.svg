    <text x="1095" y="222" fill="#c4b5fd" font-family="Consolas, monospace" font-size="16">python · fastapi · rag</text>
    <text x="1095" y="252" fill="#86efac" font-family="Consolas, monospace" font-size="16">status: learning + building</text>
