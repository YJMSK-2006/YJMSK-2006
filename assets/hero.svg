    <circle cx="1510" cy="90" r="5"/><circle cx="1090" cy="280" r="5"/>
    <circle cx="1200" cy="215" r="5"/><circle cx="1320" cy="295" r="5"/>
    <circle cx="1440" cy="230" r="5"/><circle cx="1530" cy="300" r="5"/>
