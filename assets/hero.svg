    <text x="92" y="273" fill="#c4b5fd" font-size="23">Python Developer · Aspiring Software Development Engineer</text>
    <text x="92" y="330" fill="#94a3b8" font-size="17">Building practical solutions with AI, web technologies and APIs.</text>
    <rect x="1070" y="125" width="420" height="175" rx="15" fill="#080f1d" stroke="#475569" stroke-opacity=".75"/>
