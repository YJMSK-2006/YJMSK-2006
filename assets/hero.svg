<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Y J M Saikrishna — AI, ML, Web and Software Engineering</title>
  <desc id="desc">A dark navy technology banner with cyan and violet gradients, abstract connection nodes, and a developer terminal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#101b35"/>
      <stop offset="100%" stop-color="#17143b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#2563eb" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93c5fd" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="1320" cy="100" r="420" fill="url(#glow)"/>
  <g fill="none" stroke="url(#accent)" stroke-opacity=".35" stroke-width="2">
    <path d="M1040 85L1160 145L1280 80L1400 155L1510 90"/>
    <path d="M1090 280L1200 215L1320 295L1440 230L1530 300"/>
    <path d="M1160 145L1200 215M1280 80L1320 295M1400 155L1440 230"/>
